services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: isucon
      MYSQL_DATABASE: isubid
      MYSQL_USER: isucon
      MYSQL_PASSWORD: isucon
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uisucon", "-pisucon"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: ../webapp/go
    environment:
      ISUBID_DB_HOST: mysql
      ISUBID_SQL_DIR: /webapp/sql
      ISUBID_INITIAL_DATA_DIR: /initial-data
      ISUBID_PUBLIC_DIR: /webapp/public
      # 開発用の固定値。未設定でも起動はするが(webapp/go/session.go参照)、
      # その場合は起動のたびに鍵が変わりコンテナ再起動でセッションが切れる。
      # ここで固定しておくことで `docker compose up` の再起動をまたいでも
      # ログイン状態が保たれる。本番/コンテスト環境では、この値を使い回さず
      # 環境ごとに固有の値を設定すること(MYSQL_ROOT_PASSWORD等と同様、開発用の既定値)。
      ISUBID_SESSION_SECRET: "302ac48b45808fdd26df094d8501b7b86b907ec74f3fa46f6370e5388b4c2dcc"
    volumes:
      - ../webapp/sql:/webapp/sql:ro
      - ../initial-data/out:/initial-data:ro
      - ../webapp/public:/webapp/public:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../webapp/public:/webapp/public:ro
    depends_on:
      - app

volumes:
  mysql-data:
